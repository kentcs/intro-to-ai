<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Introduction to AI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <style>
        body { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif; padding: 48px 24px; }
        .container { background: white; border-radius: 12px; box-shadow: 0 10px 40px rgba(0,0,0,.2); padding: 40px; max-width: 960px; width: 100%; }
        h1 { color: #667eea; margin-bottom: 18px; font-weight: 700; font-size: 42px; line-height: 1.1; }
        .intro { color: #444; font-size: 17px; line-height: 1.55; margin-bottom: 30px; max-width: 780px; }
        .chapter-label { color: #764ba2; font-size: 18px; font-weight: 700; margin-bottom: 8px; }
        .chapter-title { white-space: nowrap; }
        .toc-section { margin-bottom: 30px; }
        .toc-section h2 { color: #764ba2; font-size: 18px; font-weight: 600; margin-bottom: 15px; border-bottom: 2px solid #667eea; padding-bottom: 8px; }
        .toc-link { display: block; padding: 12px 16px; margin-bottom: 8px; background: #f8f9fa; border-left: 4px solid #667eea; text-decoration: none; color: #333; border-radius: 4px; transition: all .2s ease; }
        .toc-link:hover { background: #e7e9ff; border-left-color: #764ba2; transform: translateX(4px); }
        .description { color: #666; font-size: 14px; margin-top: 4px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Introduction to AI</h1>
        <p class="intro">Course materials will appear here as they are released.</p>

        <div class="toc-section">
            <h2>Chapters</h2>
        </div>
        <div class="toc-section">
            <h2>Repository</h2>
            <p class="intro">The course code is in the public GitHub repository at <a href="https://github.com/kentcs/intro-to-ai">kentcs/intro-to-ai</a>. You can fork it on GitHub, clone it with <code>git clone https://github.com/kentcs/intro-to-ai.git</code>, or open it in <a href="https://github.com/kentcs/intro-to-ai">GitHub Codespaces</a>.</p>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
